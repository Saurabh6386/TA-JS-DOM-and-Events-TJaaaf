<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Form Validation 👇</title>
</head>

<body>
    <h1>Contact Form</h1>
    <form>
        <div class="container">
            <div class="form-control">
                <label for="text">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter you Username" />
                <small></small>
            </div>

            <div class="form-control">
                <label for="text">Your Name</label>
                <input type="text" id="name" name="name" placeholder="Enter you name" />
                <small></small>
            </div>


            <div class="form-control">
                <label for="email"> Your Email</label>
                <input type="text" id="email" name="email" placeholder="Enter you email" />
                <small></small>
            </div>

            <div class="form-control">
                <label for="contact">Your Contact</label>
                <input type="text" id="contact" name="contact" placeholder="Contact number" />
                <small></small>
            </div>


            <div class="form-control">
                <label for="Password">Your Password</label>
                <input type="password"name="password" placeholder="Enter you Password" />
            </div>


            <div class="form-control">
                <label for="Confirm-Password">Confirm Password</label>
                <input type="password" name="confirmpassword" placeholder="Confirm  your password" />
                <small></small>
            </div>
            <input type="Submit" value="submit" id="btn">

        </div>
    </form>

    <script src="script.js"></script>
</body>

</html>
