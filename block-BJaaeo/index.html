<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <center>
        <h1>🤯 Calculator 🤩</h1>
        <div class="parent">
            <div class="screen"></div>
            <div class="calculator">
                <button class="plus common">+</button>
                <button class="minus common">-</button>
                <button class="multiply common">*</button>
                <button class="divide common">/</button>
                <button class="seven common">7</button>
                <button class="eight common">8</button>
                <button class="nine common">9</button>
                <button class="four common">4</button>
                <button class="five common">5</button>
                <button class="six common">6</button>
                <button class="one common">1</button>
                <button class="two common">2</button>
                <button class="three common">3</button>
                <button class="dot common">.</button>
                <button class="zero common">0</button>
                <button class="clear common">C</button>
                <button class="equal">=</button>
            </div>
        </div>
    </center>
    <script src="./script.js"></script>
</body>

</html>
